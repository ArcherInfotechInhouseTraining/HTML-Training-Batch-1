<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Micky Mouse</title>
	</head>
	<body>
		<h2>Micky Mouse Using SVG</h2>

		<svg width="500" height="500" style="border: 2px solid black;" >

			<!-- small circle-1 -->

			<circle cx="110" cy="80" r="40" fill="black" stroke-width="2" />

			<!-- big circle -->
			<circle cx="180" cy="150" r="70" fill="black"stroke-width="2" />

			<!-- small circle-2 -->
			<circle cx="250" cy="80" r="40" fill="black" stroke-width="2" />

			<!-- ellipse-1 -->
			<ellipse cx="160" cy="150" rx="30" ry="50" fill="NavajoWhite" stroke-width="2" />

			<!-- ellipse-2 -->
			<ellipse cx="200" cy="150" rx="30" ry="50" fill="NavajoWhite" stroke-width="2" />

			<!-- ellipse-3 horizontal -->
			<ellipse cx="180" cy="199" rx="65" ry="30" fill="NavajoWhite" stroke-width="2" />

			<!-- eye-1 left-->
			<ellipse cx="165" cy="150" rx="10" ry="25" fill="white" stroke="black" stroke-width="2" />

			<!-- black part for eye-1 -->
			<ellipse cx="168" cy="165" rx="5" ry="10" fill="black" stroke-width="2" />

			<!-- white part-1 -->
			<circle cx="167" cy="157" r="2" fill="white" stroke-width="2" />

			<!-- eye-2 right -->
			<ellipse cx="190" cy="150" rx="10" ry="25" fill="white" stroke="black" stroke-width="2" />

			<!-- black part for eye-2 -->
			<ellipse cx="188" cy="165" rx="5" ry="10" fill="black" stroke-width="2" />

			<!-- white part-2 -->
			<circle cx="189" cy="157" r="2" fill="white" stroke-width="2" />

			<!--  path for half curve -->

			<path d=" M 140 100 A 250 200 0 0 190 50 " fill="none" stroke="black" stroke-width="3" transform="rotate( -80 190 80)" /> 

			<!-- nose -->
			<ellipse cx="180" cy="198" rx="23" ry="15" fill="black" stroke-width="2" />

			<!-- nose white part -->
			<ellipse cx="180" cy="190" rx="9" ry="5" fill="white" stroke-width="2" />

			



		</svg>
		

	</body>
</html>
