<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>SVG Shapes Example </title>
	</head>
	<body>
		<h2>SVG Shapes</h2>

		<svg width="500" height="500" style= "border: 2px solid black;">

			<!-- Rectangle -->
			<rect x="10" y="10" width="100" height="50" fill="blue" stroke="black" stroke-width="2" />

			<!-- Circle -->
			<circle cx="200" cy="35" r="25" fill="green" stroke-width="2" stroke="black" />

			<!-- Ellipse -->
			<ellipse cx="350" cy="35" rx="50" ry="25" fill="purple" stroke="black" stroke-width="2" />

			<ellipse cx="350" cy="35" rx="50" ry="5" fill="purple" stroke="black" stroke-width="2" />

			<!-- Line -->
			<line x1="10" y1="100" x2="200" y2="100" stroke="red" stroke-width="2" />

			<!-- Polygon -->
			<polygon points="300, 150 350, 100 400, 150" fill="orange" stroke="black" stroke-width="2" />

			<!-- Polyline -->
			<polyline points="10, 200 50, 150 90, 200 130, 150" fill="none" stroke="brown" stroke-width="2" />

			<!-- Path -->
			<path d="M 10 250 C 20 230, 40 230, 50 250 S 80 270, 90 250" fill="none" stroke="blue" stroke-width="2" />
		</svg>
	</body>
</html>
