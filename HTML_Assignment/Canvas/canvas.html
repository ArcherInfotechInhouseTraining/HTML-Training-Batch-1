<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Canvas all shapes</title>
	</head>
	<body>
		<h2>Canvas Shapes</h2>
		<canvas id="myCanvas" width="500" height="500" style="border: 1px solid black;">
		</canvas>

		<script>
			var canvas = document.getElementById('myCanvas');
			var ctx = canvas.getContext('2d');

			//rectangle
			ctx.fillStyle = 'blue';
			ctx.fillRect(10,10,100,50);
			ctx.strokeRect(10,10,100,50);

			//Circle
			ctx.beginPath();
			ctx.arc(200, 35, 25, 0, 2*Math.PI);
			ctx.fillStyle = 'green';
			ctx.fill();
			ctx.stroke();

			//Ellipse
			ctx.beginPath();
			ctx.ellipse(350, 35, 50, 25, 0, 0, 2*Math.PI);
			ctx.fillStyle = 'purple';
			ctx.fill();
			ctx.stroke();

			//Line
			ctx.beginPath();
			ctx.moveTo(10, 100);
			ctx.lineTo(200, 100);
			ctx.strokeStyle = 'red';
			ctx.lineWidth = 2;
			ctx.stroke();

			//Polygon(Triangle)
			ctx.beginPath();
			ctx.moveTo(300, 150);
			ctx.lineTo(350, 100);
			ctx.lineTo(400,150);
			ctx.closePath();
			ctx.fillStyle = 'orange';
			ctx.fill();
			ctx.stroke();

			//Polyline
			ctx.beginPath();
			ctx.moveTo(10, 200);
			ctx.lineTo(50, 150);
			ctx.lineTo(90,200);
			ctx.lineTo(130, 150);
			ctx.strokeStyle = 'brown';
			ctx.lineWidth = 2;
			ctx.stroke();

			//path
			ctx.beginPath();
			ctx.moveTo(10, 250);
			ctx.bezierCurveTo(20,230,40,230,50,250);
			ctx.quadraticCurveTo(80, 270, 90, 250);
			ctx.strokeStyle = 'blue';
			ctx.lineWidth = 2;
			ctx.stroke();
		</script>
	</body>
</html>
