<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Tooltip Example</title>
		<style >
			
			.tooltip {
			  position: relative;
			  display: inline-block;
			  cursor: pointer;
			  margin: 100px
			}

			.tooltip .tooltiptext {
			  visibility: hidden;
			  width: 120px;
			  background-color: #555;
			  color: #fff;
			  text-align: center;
			  border-radius: 5px;
			  padding: 5px;
			  position: absolute;
			  z-index: 1;
			  top: 125%; /* Position the tooltip above the text */
			  left: 50%;
			  margin-left: -60px; /* Center the tooltip */
			  opacity: 0; /* Hide the tooltip */
			  transition: opacity 0.3s;
			}

			.tooltip:hover .tooltiptext {
			  visibility: visible;
			  opacity: 1;
			}

			.tooltip .tooltiptext::after{
			  content: "-> ";
			  position: absolute;
			  top: 100%;
			  left: 50%;
			  margin-left: -5px;
			  border-width: 5px;
			  border-style: solid;
			  background-color: blue;
			  border-color: #555 transparent transparent transparent;
			}

		</style>
	</head>
	<body>
		<div class="tooltip">
  			Hover over me
  			<span class="tooltiptext">Tooltip text</span>
		</div>
	</body>
</html>
