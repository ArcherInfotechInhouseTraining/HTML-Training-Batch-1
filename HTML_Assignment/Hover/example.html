<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Zoom Hover</title>
		<style>
			.zoom {
					padding: 50px;
					background-color: green;
/*					transition: transform .2s;*/
					width: 200px;
					height: 200px;
					margin: 0 auto;
				}
			.zoom:hover{
				/*-ms-transform: scale(1.5); 
  				-webkit-transform: scale(1.5); */
  				transform: scale(1.9); 
			}


		</style>
	</head>
	<body>
		<h2>Zoom Hover</h2>
		<div class="zoom"></div>

	</body>
</html>
