<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact Page</title>
	<style>
		.header{
			display: flex;
			background-color: lightcyan;
			width: 100%;
			height: 30%;
			text-align: center;
			font-size: 40px;
		}
		.header img{
			width: 250px;
			height: 200px;
		}	
		.con a{
			float: left;
			gap: 150px;
			color: black;
			padding: 10px 20px;
			text-decoration: none;
			margin-top: 140px;
			font-size: 20px;
			font-family: sans-serif;
		}
		.main{
			width: 100%;
			height: 100%;
			margin-top: 0px;
		}
		.sub{
			text-align: center;
			font-size: 30px;
			color: rgb(140, 21, 21);
		}
		.para{
			text-align: center;
			font-size: 22px;
		}
		.form{
			height: 100%;
			margin-left: 200px;
		}
		.form input{
			padding: 15px;
			width: 600px;
			margin:10px 0px 0px 250px;
			font-size: 20px;
		}
		textarea{
			margin:10px 0px 2px 250px ;
			width: 622px;
			padding: 5px 0px 0px 10px;
			font-size: 20px;
		}
		button{
			margin:0px 0px 2px 485px;
			padding: 10px 40px;
			text-align: center;
			font-size: 20px;
			background: rgb(140, 21, 21);
			color: white;
		}
		button:hover{
			transform: scale(1.1);
		}

	</style>
</head>
<body>
<div class="header">
	<img src="images/headerpng.png">
	<h1>Travels Agency</h1>
		<div class="con">	
			<a href="http://127.0.0.1:5501/Travelwebsite.html?email=saurabhupashe%40gmail.com">Home</a>
			<a href="#about">About</a>
  			<a href="http://127.0.0.1:5501/tour.html">Tours</a>
			<a href="#hotel">Hotel</a>
			<a href="http://127.0.0.1:5501/ContactUs.html">Contact</a>
			<a href="#help" style="margin-left: 100px;">Help</a>
		</div>
</div>
<div class="main">
	<div class="sub">
		<h1>Contact Us</h1>
	</div>
	<div class="para">
		<p>Have questions? Want to work with us? We're happy to chat!</p>
	</div>
	<form class="form">
		<input type="name" name="name" id="name" placeholder="Name" required><br>
		<input type="email" name="email" id="email" placeholder="Email" required><br>
		<input type="text" name="text" id="text" placeholder="Subject"><br>
		<textarea id="message" name="message" rows="4"placeholder="Message"></textarea><br>
		<button type="submit">SEND</button>
	</form>
</div>
</body>
</html>
