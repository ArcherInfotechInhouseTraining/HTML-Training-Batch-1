<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>X-Profile - My Virtual Profile Card</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<style>
		body{
			background: url(profileimages/background.png);
			height: 100vh;
			align-items: center;
			justify-content: center;
			display: flex;
		}

		.flex-container{
			justify-content: space-between;
			display: flex;
			margin-left: -50px;
			margin-right: -50px;
		}

		.flex-container .menu-icon img{
			width: 25px;
		}

		.flex-container .setting-icon img{
			width: 25px;
		}

		.profile-box{
			width:447px;
			height: 430px;
			background: #ff574a;
			color: #ffffff;
			text-align: center;
			padding: 40px 90px;
			border-radius: 20px;
		}

		.profile-pic img{
			width: 150px;
			padding: 6px;
			border-radius: 50%;
			background-color: white;
		}
		.social-media img{
			width: 20px;
			cursor: pointer;
			margin: 5px;
		}

	</style>
</head>

<body>
	<div class="profile-box">

		<div class="flex-container">
			<div class="menu-icon">
				<img src="profileimages/menu-icon.png">
			</div>

			<div class="setting-icon">
				<img src="profileimages/setting-icon.png">
			</div>

		</div>

		<div class="profile-pic">
			<img src="profileimages/profile-pic.png">
		</div>
		

		<h3>Learner Beaver</h3>
		<p>Frontend Dev at CrioDo, Bengaluru</p>

		<div class="social-media">
			<img src="profileimages/instagram.png">
			<img src="profileimages/telegram.png">
			<img src="profileimages/dribble.png">
		</div>

	</div>



	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
